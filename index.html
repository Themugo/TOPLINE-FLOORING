<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="application-name" content="Topline" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Topline" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="theme-color" content="#0c2d57" />
    <meta name="color-scheme" content="light" />
    <meta name="description" content="Topline Flooring and Waterproofing delivers professional flooring, coatings and waterproofing solutions across Kenya." />
    <meta name="robots" content="index,follow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta property="og:site_name" content="Topline Flooring and Waterproofing" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Topline Flooring &amp; Waterproofing" />
    <meta property="og:description" content="Professional flooring, coatings and waterproofing solutions across Kenya." />
    <meta property="og:locale" content="en_KE" />
    <title>Topline Flooring &amp; Waterproofing</title>
    <style>
      /* First paint: match the brand instead of flashing white while the app downloads and starts. */
      html, body { margin: 0; background: #f7f6f3; }
      #boot-splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #0c2d57; color: #fff; font: 600 15px/1.3 system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing: .02em; z-index: 0; }
      #boot-splash i { width: 28px; height: 28px; border: 3px solid rgba(255,255,255,.25); border-top-color: #b4e33d; border-radius: 50%; animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #boot-splash i { animation: none; } }
    </style>
    <script src="/boot.js"></script>
  </head>
  <body>
    <div id="root"><div id="boot-splash" role="status" aria-label="Loading Topline"><i></i><span>Topline Flooring &amp; Waterproofing</span></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
