[functions.communication-provider-webhook]
verify_jwt = false

[functions.sms-inbound]
verify_jwt = false

[functions.email-inbound]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false


[functions.customer-data-export]
