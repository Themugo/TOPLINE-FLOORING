# Topline Flooring & Water Roofing — Supabase project configuration
# The project ref is safe to commit; secrets must remain in environment variables.
project_id = "zmbsskvnzjdaxuxlauyx"

[auth]
enabled = true
# Auth policy is codified here so it can be reviewed and cannot silently fall back to Supabase defaults if
# `supabase config push` is ever run. The marketing opt-in relies on verified email addresses, so confirmations
# must stay on. Leaked-password protection is a hosted-project (Pro) dashboard setting and is not available here.
site_url = "https://toplineflooringandwaterproofing.co.ke"
additional_redirect_urls = [
  "https://toplineflooringandwaterproofing.co.ke/portal",
  "https://toplineflooringandwaterproofing.co.ke/admin/settings",
]
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true
# Email/password authentication is enabled by Supabase Auth by default.
# Do not use the obsolete [auth.email].enabled key.

[db]
major_version = 17

[functions.deliver-communications]
verify_jwt = false

[functions.sms-delivery-report]
verify_jwt = false

[functions.communication-provider-webhook]
verify_jwt = false

[functions.sms-inbound]
verify_jwt = false

[functions.email-inbound]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false


[functions.customer-data-export]
verify_jwt = true

[functions.expire-reservations]
verify_jwt = false

[functions.operations-scheduler]
verify_jwt = false

[functions.communication-provider-readiness]
verify_jwt = false

# --- Payments -----------------------------------------------------------------------------------
# These functions authenticate callers themselves, so the gateway JWT check must be OFF:
#  * payment-initiate / payment-status are called from the customer's browser with the publishable
#    key (not a user JWT) and are authorised by a one-time access token (stored only as a hash).
#  * payment-callback / payment-webhook are called by M-Pesa and card providers, which cannot send a
#    Supabase JWT; they verify a shared secret or an HMAC signature.
# With the CLI default (verify_jwt = true) every one of these calls is rejected with 401 before the
# function runs, so checkout, payment status and provider callbacks all fail in production.
[functions.payment-initiate]
verify_jwt = false

[functions.payment-status]
verify_jwt = false

[functions.payment-callback]
verify_jwt = false

[functions.payment-webhook]
verify_jwt = false

# Staff-only: invoked from the admin app with the signed-in user's JWT; the function also checks the
# caller's permissions itself.
[functions.brevo-test-email]
verify_jwt = true
