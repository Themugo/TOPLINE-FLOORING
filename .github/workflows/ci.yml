name: Topline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: topline-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Production Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository toolchain gate
        run: npm run verify:doctor

      - name: Phase 14 CI / release-gate contract
        run: npm run verify:phase-14-ci-release-gate

      - name: Vercel deployment contract
        run: npm run verify:vercel

      - name: Local Supabase replay
        run: npm run validate:local-db

      - name: Commerce Fulfillment 360 contract
        run: npm run verify:commerce-fulfillment-360

      - name: Order Operations 360 type contract
        run: npm run verify:order-operations-360

      - name: Authorization + Order Operations 360 contract
        run: npm run verify:authorization-order-360

      - name: Generated database type contract
        env:
          REQUIRE_GENERATED_TYPES: true
        run: npm run verify:generated-types

      - name: Static architecture and migration verification
        run: |
          npm run verify:phases-30-32
          npm run verify:phases-33-35
          npm run verify:production-db-preflight
          npm run verify:phases-36-38
          npm run verify:phases-39-41
          npm run verify:phases-42-44
          npm run verify:phases-45-47
          npm run verify:ecommerce-stability
          npm run verify:migration-integrity
          npm run verify:payment-inventory-lifecycle
          npm run verify:payment-refund-expiry
          npm run verify:payment-provider-boundary
          npm run verify:release-candidate
          npm run verify:public-order-tracking-privacy
          npm run verify:phase-8-field-operations
          npm run verify:phase-10-finance-billing-360
          npm run verify:phase-11-inventory-procurement-360
          npm run verify:phase-12-customer-portal-360
          npm run verify:phase-13-backup-export-360
          npm run verify:phase-14-ci-release-gate
          npm run verify:phase-18-20-communications-provider-response
          npm run verify:phases-21-23-finance-communications-analytics-360
          npm run verify:phases-24-26-reporting-intelligence-360
          npm run verify:phases-27-29-public-accessibility-seo-360

      - name: Frontend quality
        run: |
          npm run lint
          npm run typecheck
          npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: topline-production-dist-${{ github.sha }}
          path: dist
          if-no-files-found: error
          retention-days: 7


      - name: Phase 80–82 verification
        run: npm run verify:phases-80-82

      - name: Phase 83–85 verification
        run: npm run verify:phases-83-85

      - name: Phase 86–88 verification
        run: npm run verify:phases-86-88

      - name: Phase 89–91 verification
        run: npm run verify:phases-89-91

      - name: Operation 1 commercial lifecycle verification
        run: npm run verify:operation-1-commercial-lifecycle

      - name: Operation 2 project delivery verification
        run: npm run verify:operation-2-project-delivery

      - name: Operation 3 supply chain verification
        run: npm run verify:operation-3-supply-chain

      - name: Operation 4 finance verification
        run: npm run verify:operation-4-finance

      - name: Operation 5 fulfillment and delivery verification
        run: npm run verify:operation-5-fulfillment-delivery

      - name: Operation 6 customer lifecycle verification
        run: npm run verify:operation-6-customer-lifecycle
      - name: Operation 7 communications customer journey verification
        run: npm run verify:operation-7-communications-journey

      - name: Operation 8 executive operations verification
        run: npm run verify:operation-8-executive-operations

      - name: Operation 9 production certification
        run: npm run verify:operation-9-production-certification

      - name: Operation 10 reliability and incident response
        run: npm run verify:operation-10-reliability-incident-response

      - name: Operation 11 business continuity and disaster recovery
        run: npm run verify:operation-11-business-continuity
