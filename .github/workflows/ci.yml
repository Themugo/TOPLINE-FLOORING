name: Topline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Repository toolchain gate
        run: npm run verify:doctor
      - name: Vercel deployment contract
        run: npm run verify:vercel
      - name: Local Supabase replay
        run: npm run validate:local-db
      - name: Commerce Fulfillment 360 contract
        run: npm run verify:commerce-fulfillment-360
      - name: Order Operations 360 type contract
        run: npm run verify:order-operations-360

      - name: Authorization + Order Operations 360 contract
        run: npm run verify:authorization-order-360
      - name: Generated database type contract
        env:
          REQUIRE_GENERATED_TYPES: true
        run: npm run verify:generated-types
      - name: Static architecture and migration verification
        run: |
          npm run verify:phases-30-32
          npm run verify:phases-33-35
          npm run verify:phases-36-38
          npm run verify:phases-39-41
          npm run verify:phases-42-44
          npm run verify:phases-45-47
          npm run verify:ecommerce-stability
          npm run verify:migration-integrity
          npm run verify:payment-inventory-lifecycle
          npm run verify:payment-refund-expiry
          npm run verify:payment-provider-boundary
          npm run verify:release-candidate
          npm run verify:public-order-tracking-privacy
      - name: Frontend quality
        run: |
          npm run lint
          npm run typecheck
          npm run build
