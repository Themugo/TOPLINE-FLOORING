name: Topline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Static architecture and migration verification
        run: |
          npm run verify:phases-30-32
          npm run verify:phases-33-35
          npm run verify:phases-36-38
          npm run verify:phases-39-41
          npm run verify:phases-42-44
          npm run verify:phases-45-47
          npm run verify:ecommerce-stability
          npm run verify:migration-integrity
          npm run verify:payment-inventory-lifecycle
          npm run verify:payment-refund-expiry
          npm run verify:payment-provider-boundary
          npm run verify:release-candidate
      - name: Frontend quality
        run: |
          npm run lint
          npm run typecheck
          npm run build
